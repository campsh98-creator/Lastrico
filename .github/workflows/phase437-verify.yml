# TEMPORARY (Phase 4.37 review of PR #16): runs only on pushes to the PR branch and is removed before merge.
# Earlier runs of this workflow already gave the Linux evidence for the Milan-only release copy (no Rome, Roccella kept,
# 535 tests, 0 failures) and for the complete mobile E2E suite. What is left is one scenario, F1 (arrow glide), that
# failed in full-suite runs on the branch but passed once on the baseline: this study repeats the full mocked suite three
# times on each side, on separate runners, to tell a load-sensitive scenario from a regression. Nothing is deployed.
name: Phase 4.37 verification (temporary)

on:
  push:
    branches:
      - fix/phase437-anti-pave-candidates

permissions:
  contents: read

jobs:
  f1-repeat-study:
    name: F1 repeat study (${{ matrix.variant }} #${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, branch]
        rep: [1, 2, 3]
    env:
      FORCE_COLOR: "0"
      COMMIT: ${{ matrix.variant == 'baseline' && '3e31da9' || github.sha }}
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare and build the Milan-only release copy of the commit under study
        run: |
          echo "commit under study: $COMMIT"
          node scripts/prepare-milan-release.mjs "$RUNNER_TEMP/rc" --commit="$COMMIT" 2>&1 | tail -3
          cd "$RUNNER_TEMP/rc" && npm run build 2>&1 | tail -2
      - name: Start the local Worker
        working-directory: ${{ runner.temp }}/rc
        run: |
          WRANGLER_SEND_METRICS=false WRANGLER_LOG_PATH=.wrangler/wrangler.log nohup npx wrangler dev --config dist/server/wrangler.json --port 8799 --local --show-interactive-dev-session=false > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8799/manifest.webmanifest && break; sleep 2; done
      - name: Full mocked E2E suite
        working-directory: ${{ runner.temp }}/rc
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/e2e/acceptance.mjs --mock-only 2>&1 | tee "$RUNNER_TEMP/e2e.txt" | grep -E "^(FAIL|[0-9]+/[0-9]+ passed)"
          echo "STUDY ${{ matrix.variant }} #${{ matrix.rep }}: $(grep -E '^PASS F1' "$RUNNER_TEMP/e2e.txt" | cut -c1-60 || true) | $(grep -E '^FAIL F1' "$RUNNER_TEMP/e2e.txt" | cut -c1-120 || true)"
