version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Groups are matched in this order. React refuses a react and react-dom of different versions, and the
      # pinned react-server-dom-webpack follows the same release, so the family moves in one pull request.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-server-dom-webpack"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # Minor and patch updates of the other development tools; each major version arrives as its own pull request.
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
