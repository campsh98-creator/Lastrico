name: Proposta
description: Proponi un miglioramento circoscritto per Lastrico.
title: "[Proposta] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema da risolvere
      description: Descrivi il bisogno prima della soluzione.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Soluzione proposta
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Verifiche
      options:
        - label: La proposta mantiene Lastrico come esperienza di navigazione primaria.
          required: true
        - label: La proposta non richiede la raccolta di dati personali non necessari.
          required: true
