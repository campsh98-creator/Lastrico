name: Beta feedback
description: Share structured feedback about the current beta experience.
title: "[Beta] "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: "Milan is the current beta area. Do not publish a home address, live location, licence plate, credentials, or identifiable travel history."
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Route calculation
        - Mobile interface
        - GPS and rerouting
        - Map
        - Community reports
        - PWA installation
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Travel mode
      options:
        - Car
        - Motorcycle
        - Bicycle
        - All modes
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region or municipality
      placeholder: "Example: Milan"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Example: iPhone 15, Safari"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal locations, credentials, licence plates, and identifiable travel data.
          required: true
